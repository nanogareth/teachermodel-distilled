# Jurisdiction profile: Ireland (base). Contract: tm:contract/jurisdiction@1.
# Design: docs/specs/2026-10-24-privacy-jurisdictions-design.md, sections 2 and 3.
#
# DRAFT. AI-assisted research notes for internal legal. Not legal advice. Nothing here counts until
# internal legal signs the exact bytes of this file on the generated review page (workflow
# tm:workflow/privacy-base, step tm:step/base-profile-verified). Verification is that bound sign-off,
# never a field in this file. Detail the contract has no field for (source notes, derivations, open
# questions) is in review_notes. Where a source could not be fetched, review_notes says so.

schema_version: 1
id: tm:jurisdiction/ie
name: "Ireland (base profile, GDPR and the Data Protection Act 2018)"
codes: [IE]
role: base
scope: >-
  The organisation is established in Ireland. GDPR applies to processing in the context of the
  activities of an establishment in the Union, whether or not the processing takes place in the
  Union (GDPR Art. 3(1)). So this profile covers every instructor, wherever they work. An
  overlay adds duties for an instructor's own jurisdiction.

laws:
  - name: General Data Protection Regulation
    citation: "Regulation (EU) 2016/679"
  - name: Data Protection Act 2018 (Ireland), as revised
    citation: >-
      No. 7 of 2018. Relevant sections: s.34 designation of a data protection officer; s.41
      further processing for another purpose (narrow grounds); s.57 Article 22 exception where a
      decision is authorised by an enactment; s.60 restrictions on data subject rights, including
      for legal claims; s.108 complaints to the Commission.

regulator:
  name: Data Protection Commission (An Coimisiun um Chosaint Sonrai)
  url: https://www.dataprotection.ie

# The bases legal may choose from for each purpose. The proposal for each is in purposes.yaml.
# Contract is listed only where the processing is objectively necessary to perform the
# instructor's contract. Legitimate interests needs a documented balancing test and brings the
# right to object (Art. 21(1)). Consent is not allowed for any current purpose.
lawful_bases:
  tm:purpose/clearance-decision: [legitimate-interests, contract]
  tm:purpose/coaching: [legitimate-interests, contract]
  tm:purpose/calibration-and-audit: [legitimate-interests]
  tm:purpose/quality-review: [legitimate-interests]
  tm:purpose/bench-decision: [legitimate-interests, contract]
  tm:purpose/staffing-check: [legitimate-interests, contract]
  tm:purpose/train-the-trainer: [legitimate-interests, contract]
  tm:purpose/record-of-actions: [legitimate-interests, legal-obligation]
  tm:purpose/privacy-administration: [legal-obligation, legitimate-interests]

consent_valid_in_employment: false

# Mandatory notice content. The notice template marks each element by id, and rendering fails if a
# marker is missing or its section is empty. Art. 13 applies to data collected from the instructor;
# Art. 14 to data obtained otherwise (observers' scores, roster data from HR, outcome aggregates).
# "Applies" says when the GDPR requires the element; the template always carries every element.
notice_elements:
  - id: controller-identity
    requirement: Identity and contact details of the controller and, if any, its representative. Applies always.
    citation: "GDPR Art. 13(1)(a); Art. 14(1)(a)"
  - id: dpo-contact
    requirement: Contact details of the data protection officer. Applies if a DPO is designated.
    citation: "GDPR Art. 13(1)(b); Art. 14(1)(b); DPA 2018 s.34"
  - id: purposes-and-bases
    requirement: The purposes of the processing and the legal basis for each. Applies always.
    citation: "GDPR Art. 13(1)(c); Art. 14(1)(c)"
  - id: legitimate-interests
    requirement: >-
      The legitimate interests pursued, for each purpose that relies on them. Applies if a purpose
      rests on legitimate interests.
    citation: "GDPR Art. 13(1)(d); Art. 14(2)(b)"
  - id: categories-of-data
    requirement: The categories of personal data concerned. Applies if data is not obtained from the instructor.
    citation: "GDPR Art. 14(1)(d)"
  - id: recipients
    requirement: The recipients or categories of recipients, if any. Applies always.
    citation: "GDPR Art. 13(1)(e); Art. 14(1)(e)"
  - id: transfers
    requirement: >-
      Any intended transfer to a third country, whether an adequacy decision exists, the
      safeguards used and how to get a copy of them. Applies if data is transferred outside the EEA.
    citation: "GDPR Art. 13(1)(f); Art. 14(1)(f)"
  - id: retention
    requirement: How long the data is stored, or the criteria used to set that period. Applies always.
    citation: "GDPR Art. 13(2)(a); Art. 14(2)(a)"
  - id: rights
    requirement: >-
      The rights of access, rectification, erasure, restriction, objection and, where it applies,
      portability. Applies always.
    citation: "GDPR Art. 13(2)(b); Art. 14(2)(c)"
  - id: right-to-object
    requirement: >-
      The right to object, brought explicitly to the instructor's attention and presented clearly
      and separately from other information. Applies if a purpose rests on legitimate interests.
    citation: "GDPR Art. 21(1), (4)"
  - id: withdraw-consent
    requirement: >-
      The right to withdraw consent at any time, without affecting earlier processing. Applies if
      a purpose rests on consent.
    citation: "GDPR Art. 13(2)(c); Art. 14(2)(d)"
  - id: complaint
    requirement: >-
      The right to lodge a complaint with a supervisory authority (in Ireland, the DPC). Applies always.
    citation: "GDPR Art. 13(2)(d); Art. 14(2)(e); Art. 77"
  - id: statutory-or-contractual-requirement
    requirement: >-
      Whether providing the data is a statutory or contractual requirement, or needed to enter a
      contract, whether the instructor must provide it, and what happens if they do not. Applies
      if data is collected from the instructor.
    citation: "GDPR Art. 13(2)(e)"
  - id: source
    requirement: >-
      The source of the data, and whether it came from publicly accessible sources. Applies if
      data is not obtained from the instructor.
    citation: "GDPR Art. 14(2)(f)"
  - id: automated-decisions
    requirement: >-
      Whether there is automated decision-making, including profiling, and if so meaningful
      information about the logic and its likely consequences. Applies always. This draft states
      that there is none: named people make every decision.
    citation: "GDPR Art. 13(2)(f); Art. 14(2)(g); Art. 22"
notice_timing:
  rule: >-
    Art. 13 information is given when the data is obtained. Art. 14 information is given within a
    reasonable period and at the latest within one month, or at first communication with the
    instructor if earlier.
  citation: "GDPR Art. 13(1); Art. 14(3)"

# No statutory period was found for instructor training, observation, coaching or clearance
# records, so there is no limit to state (see review_notes: retention).
retention_limits: []

# Each criterion is a screening criterion id used by the DPIA screening page
# (src/teachermodel/pages.py, _DPIA_CRITERIA). The citation names the WP248 rev.01 criterion
# number, the GDPR Art. 35(3) case and the DPC list items it matches.
dpia_triggers:
  - criterion: evaluation-scoring
    citation: >-
      WP248 criterion 1: evaluation or scoring, including profiling and predicting, especially
      performance at work. DPC list item 5.
  - criterion: automated-decision
    citation: >-
      WP248 criterion 2: automated decision-making with legal or similarly significant effect.
      GDPR Art. 35(3)(a). DPC list item 3.
  - criterion: systematic-monitoring
    citation: >-
      WP248 criterion 3: systematic monitoring, used to observe, monitor or control data
      subjects. GDPR Art. 35(3)(c). DPC list item 4.
  - criterion: sensitive-data
    citation: >-
      WP248 criterion 4: special-category, criminal-offence or other highly personal data. GDPR
      Art. 35(3)(b). DPC list items 6, 7 and 10.
  - criterion: large-scale
    citation: "WP248 criterion 5: data processed on a large scale. DPC list items 1, 5 and 10."
  - criterion: dataset-matching
    citation: "WP248 criterion 6: matching or combining datasets beyond reasonable expectations. DPC list item 9."
  - criterion: vulnerable-subjects
    citation: "WP248 criterion 7: data concerning vulnerable data subjects. WP248 lists employees. DPC list item 2."
  - criterion: innovative-technology
    citation: >-
      WP248 criterion 8: innovative use or new technological or organisational solutions. DPC
      list item 6.
  - criterion: prevents-rights-or-service
    citation: >-
      WP248 criterion 9: processing that prevents data subjects from exercising a right or using
      a service or contract. DPC list item 3.

transfers:
  - rule: >-
      A transfer outside the EEA needs an adequacy decision, appropriate safeguards (for example
      standard contractual clauses), or an Art. 49 derogation.
    citation: "GDPR Arts 44-49"

# deadline_days: Art. 12(3) gives one month, extendable by two further months (review_notes:
# rights-deadline). One month is written here as 30 days.
rights:
  - right: access
    deadline_days: 30
    citation: "GDPR Art. 15; Art. 12(3)"
  - right: rectification
    deadline_days: 30
    citation: "GDPR Art. 16; Art. 12(3)"
  - right: erasure
    deadline_days: 30
    citation: "GDPR Art. 17; Art. 12(3)"
  - right: restriction
    deadline_days: 30
    citation: "GDPR Art. 18; Art. 12(3)"
  - right: portability
    deadline_days: 30
    citation: "GDPR Art. 20; Art. 12(3). Applies when the basis is consent or contract and processing is automated."
  - right: object
    deadline_days: 30
    citation: >-
      GDPR Art. 21(1); Art. 12(3). Applies when the basis is legitimate interests. The controller
      must stop unless it shows compelling legitimate grounds that override the instructor's
      interests, or needs the data for legal claims.
  - right: not-subject-to-automated-decision
    deadline_days: 30
    citation: >-
      GDPR Art. 22; DPA 2018 s.57; Art. 12(3). Applies when a decision is based solely on
      automated processing with legal or similarly significant effects.
  - right: complaint
    citation: "GDPR Art. 77; DPA 2018 s.108"

breach_notification:
  regulator_hours: 72
  individuals: >-
    Without undue delay, when the breach is likely to result in a high risk to the instructor's
    rights and freedoms.
  citation: "GDPR Art. 33(1); Art. 34(1)"

