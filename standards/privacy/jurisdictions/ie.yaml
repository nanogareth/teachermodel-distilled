review_notes:
  # Sources: what was and was not fetched.
  - >-
    source EUR-Lex (GDPR): not fetched. EUR-Lex returned an empty page for three URL forms (ELI,
    HTML, PDF). Article wording was checked against gdpr-info.eu for Arts 12, 13, 33 and 88, and
    WP248 quotes Art. 35(3). Other article citations are from the drafter's knowledge and must be
    checked against EUR-Lex.
  - >-
    source gdpr-info.eu: fetched; a secondary source used only because EUR-Lex was unreachable.
  - >-
    source Data Protection Act 2018 (revised act): fetched. Table of contents, s.41 and s.57 read.
    irishstatutebook.ie returned HTTP 403. The revised act states it is up to date with changes
    known to be in force as of 13 October 2026. Section 60 was seen only in its table of contents
    and a search summary.
  - "source DPC list of processing operations requiring a DPIA, and the DPC DPIA page: fetched."
  - "source WP248 rev.01: fetched. PDF read from the document link on the page; criteria on pages 9-11."
  - >-
    source EDPB Guidelines 05/2020: the EDPB page was read; its English PDF URL returned 404.
    Paras 21-23 were read from the same version 1.1 PDF hosted by the Romanian supervisory
    authority (https://www.dataprotection.ro/servlet/ViewDocument?id=2491).
  - >-
    source DPC employer guidance: HTTP 403, not fetched. Not used for any rule in this file.
    Legal should check it.
  - >-
    sources-unreachable: EUR-Lex, irishstatutebook.ie and the DPC employer guidance could not be
    fetched. Article citations not checked against gdpr-info.eu rely on the drafter's knowledge
    and must be checked.
  - >-
    notice-timing: the Art. 14(3) wording is from the drafter's knowledge; EUR-Lex was not reachable.

  # Consent and lawful bases.
  - >-
    consent: consent is rarely valid at work. The employer and employee relationship creates an
    imbalance of power, so consent is unlikely to be freely given. The EDPB names "fill out
    assessment forms" as an example. Consent is valid only in exceptional cases where refusing
    has no adverse consequences at all (EDPB Guidelines 05/2020 v1.1, paras 21-23; GDPR Art.
    4(11); Art. 7(4)). Hence consent_valid_in_employment is false.
  - >-
    consent-contractors: the EDPB text speaks of employees. Contract and partner instructors also
    depend on the organisation for work, so this draft treats the same caution as applying to them.
    Legal to confirm.
  - >-
    basis-legitimate-interests: legitimate interests is proposed for six of eight purposes. Each
    needs a written balancing test (purpose, necessity, balance). It also gives instructors the
    right to object, which the notice must state separately (Art. 21(4)). Legal to choose between
    it and contract.
  - >-
    basis-contract: contract is listed as an alternative where the instructor is engaged to teach.
    EDPB Guidelines 2/2019 on Art. 6(1)(b) read "necessary" strictly. They were not fetched for
    this draft.
  - >-
    basis-accountability-records: record-of-actions and privacy-administration may rest on Art.
    6(1)(c) for the parts that exist to meet GDPR duties. Legal to decide; legitimate interests is
    the fallback.
  - >-
    no-consent-purpose: no purpose is proposed on consent. The baseline self-assessment is
    required in W1, and EDPB para 21 names assessment forms as a case where consent is not free. A
    future optional use (reusing a recording in teaching material) would be a consent candidate
    (design section 5).
  - >-
    lawful basis for tm:purpose/clearance-decision: the organisation has an interest in sessions being
    taught by instructors cleared against a written standard. Contract may fit for contract and
    partner instructors engaged to deliver sessions. Not consent: clearance decides teaching work.
  - >-
    lawful basis for tm:purpose/coaching: every active instructor is in the coaching cycle (spec
    v0.2, W7). It is not optional, so consent would not be freely given.
  - >-
    lawful basis for tm:purpose/calibration-and-audit: checking that observers score reliably
    protects instructors from unfair decisions. It also processes data about the observers
    themselves.
  - >-
    lawful basis for tm:purpose/quality-review: comparing delivery outcomes with the cohort
    baseline finds where coaching should focus. It never triggers a bench decision on its own.
  - >-
    lawful basis for tm:purpose/bench-decision: a bench decision (renew, convert, return to
    co-teaching, exit) is a decision about an instructor's teaching work, taken on a complete
    evidence pack by the head of training. Added with the draft of tm:purpose/bench-decision
    (decision 0014), so legal reads it with purposes.yaml. Contract may fit for engaged instructors
    where the decision applies the engagement itself; legitimate interests needs a balancing test
    and brings the right to object. Legal to decide, and to decide whether Art. 22 (decisions
    based solely on automated processing) is engaged at all: a person decides, and the rules only
    check that the evidence is complete.
  - >-
    lawful basis for tm:purpose/staffing-check: only cleared instructors are staffed on a module.
    Scheduling sees clearance status only (decision 0005).
  - >-
    lawful basis for tm:purpose/train-the-trainer: the pathway, including the baseline
    self-assessment, is required before an instructor leads sessions. EDPB 05/2020 para 21 names
    assessment forms as a case where consent is not free.
  - >-
    lawful basis for tm:purpose/record-of-actions: the append-only log shows who decided what on
    which evidence. That supports replies, appeals and the defence of claims. Parts of it may also
    serve accountability duties (Art. 5(2), Art. 24, Art. 30); legal to decide whether Art.
    6(1)(c) applies to them.
  - >-
    lawful basis for tm:purpose/privacy-administration: recording which notice version each
    instructor received, and when, shows that Arts 13 and 14 were met. Legal to confirm that the
    GDPR's own duties are a legal obligation for Art. 6(1)(c) purposes, or to use legitimate
    interests instead.
  - >-
    contractors-and-partners: partner instructors are engaged through a partner organisation.
    Legal to confirm the organisation's role (controller, joint controller) for their data and what the
    partner lead receives (clearance status only, decision 0005).
  - >-
    art-14-notice: much of the data is not collected from the instructor: observers' scores and
    notes, roster data from HR or vendors, outcome aggregates. The notice therefore needs the Art.
    14 elements (categories, source) as well as Art. 13.
  - >-
    dpo: the notice element dpo-contact assumes the organisation has designated a DPO (setup has a dpo
    role). Legal to confirm.

  # DPIA.
  - >-
    dpia-rule: a DPIA is required before processing that is likely to result in a high risk (Art.
    35(1)). Art. 35(3) and the DPC's Art. 35(4) list name cases. WP248 says processing that meets
    two of its nine criteria will in most cases need a DPIA, and sometimes one is enough. The DPC
    list applies its items "where a documented screening or preliminary risk assessment
    indicates" high risk. WP248's own table lists "a company systematically monitoring its
    employees' activities" as meeting two criteria: systematic monitoring and vulnerable data
    subjects.
  - >-
    dpia-art-35-3: Art. 35(3) cases are (a) systematic and extensive evaluation based on
    automated processing, including profiling, on which decisions with legal or similarly
    significant effects are based; (b) large-scale processing of special categories or
    criminal-offence data; (c) systematic monitoring of a publicly accessible area on a large
    scale.
  - >-
    dpia-dpc-list: the DPC list items are 1 large-scale use of personal data for a purpose other
    than the one it was collected for (Art. 6(4)); 2 profiling vulnerable persons, including
    children, to target marketing or online services; 3 profiling, algorithmic means or
    special-category data used to decide access to services, or with legal or similarly
    significant effects; 4 systematically monitoring, tracking or observing individuals' location
    or behaviour; 5 profiling individuals on a large scale; 6 biometric identification combined
    with another WP248 criterion; 7 genetic data combined with another WP248 criterion; 8
    indirectly sourced data where transparency duties are not met; 9 combining or linking
    datasets for profiling or behavioural analysis; 10 large-scale processing where the DPA 2018
    requires suitable and specific measures.
  - >-
    dpia-likely-required: the setup screening pre-fills three of the nine criteria as yes:
    evaluation or scoring, systematic monitoring, and vulnerable subjects (employees). WP248 says
    two criteria usually mean a DPIA, and its own example (an employer systematically monitoring
    staff) matches. DPC list item 4 (systematically observing behaviour) may also apply. The
    drafter expects a DPIA to be required. The DPO decides.
  - >-
    dpia-triggers-and-answers: dpia_triggers states which screening criteria are legal triggers
    and cites them; it does not say whether the programme's processing meets a criterion. The
    screening page shows each citation beside its criterion and keeps the programme's own
    answers.

  # Retention.
  - >-
    retention-unset: no statutory period was found for instructor training, observation, coaching
    or clearance records. Storage limitation applies: keep data in identifiable form no longer
    than the purpose needs (GDPR Art. 5(1)(e); Art. 13(2)(a)). Each period needs a written
    reason. Legal and the head of training must set periods per category and purpose with
    reasons, considering limitation periods for claims an instructor could bring (contract,
    employment equality, workplace complaints), which this draft did not research.
  - >-
    retention-pseudonymous-events: pseudonymous events are still personal data (GDPR Recital 26).
    Erasing the identity row ends linkability; legal to confirm this meets erasure duties for the
    event log (decision 0006).

  # Transfers.
  - >-
    transfers-store: the private store is a SharePoint library in the Microsoft 365 tenant (decision
    0006). Where Microsoft stores and processes that tenant's data is not recorded here.
  - >-
    transfers-unknown: any person outside the EEA who reads instructor records (a coach, clearer
    or coordinator in California, say) receives a transfer. Whether any reader sits outside the
    EEA is not recorded. If US-based staff read records, a transfer mechanism is needed. The
    drafter understands the EU-US Data Privacy Framework adequacy decision may cover certified
    recipients, but did not verify this from a source; intra-group transfers usually rely on
    standard contractual clauses. Legal to confirm.

  # Rights and incidents.
  - >-
    rights-deadline: act without undue delay and within one month of receipt (Art. 12(3)).
    Extendable by two further months for complex or numerous requests; tell the instructor of
    the extension and the reasons within the first month. Deadline_days is 30 as an
    approximation of one month; legal to confirm the representation.
  - >-
    rights-free-of-charge: free of charge. A reasonable fee or refusal is allowed only for
    manifestly unfounded or excessive requests (Art. 12(5)).
  - >-
    rights-restrictions: Irish law allows rights to be restricted only on the grounds listed in
    DPA 2018 s.60(3), where necessary and proportionate. They include legal claims, s.60(3)(a)(iv).
    The section 60 text was seen only in its table of contents and a search summary.
  - >-
    breach-more: a late notice to the DPC must give the reasons for the delay (Art. 33(1)). A
    processor notifies the controller without undue delay (Art. 33(2)). Every breach, its effects
    and the remedial action is documented, whether notified or not (Art. 33(5)).
  - >-
    employment-law: Member States may set more specific rules for employee data by law or
    collective agreement (Art. 88). This draft found no Irish Art. 88 provision in the DPA 2018
    table of contents. Collective agreements could also set rules. Legal to confirm none applies.

  # Programme facts.
  - >-
    incidental-special-category: the programme does not intend special-category data (so no Art. 9
    condition is listed). Free-text evidence notes and coaching notes could still mention health
    or similar matters (for example a session affected by illness). Legal to advise on guidance
    for observers and on Art. 9 if it happens.
  - >-
    automated-decisions: named people sign every clearance and level change. The staffing check
    blocks assigning an uncleared instructor; the block applies a human clearance decision and the
    head of training can override it. Legal to confirm this is not a solely automated decision
    under Art. 22.
  - >-
    recordings: observation from recordings involves the instructor's image and voice. This is
    not biometric data unless processed to identify someone uniquely. No emotion inference is
    allowed (spec v0.2, AI assistance). Learners in recordings are out of scope here (design
    section 9).
