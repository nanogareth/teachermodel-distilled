# Jurisdiction profile: California (overlay on tm:jurisdiction/ie). Contract:
# tm:contract/jurisdiction@1. Design: docs/specs/2026-10-24-privacy-jurisdictions-design.md,
# sections 2 and 3.
#
# DRAFT. AI-assisted research notes for internal legal. Not legal advice. Nothing here counts until
# internal legal signs the exact bytes of this file on the generated review page. Verification is
# that bound sign-off, never a field in this file. The Irish base still applies to California
# instructors. Where both apply, the stricter rule holds; for retention, the shorter maximum and the
# longer minimum. Detail the contract has no field for (source notes, derivations, open questions)
# is in review_notes.

schema_version: 1
id: tm:jurisdiction/us-ca
name: "California (overlay on Ireland: CCPA as amended by CPRA)"
codes: [US-CA]
role: overlay
scope: >-
  California Consumer Privacy Act of 2018 as amended by the California Privacy Rights Act. The
  exemption for job applicant, employee, owner, director, officer, medical staff and contractor
  data in Cal. Civ. Code 1798.145(m) became inoperative on 1 January 2023. Since then California
  instructors who are employees or independent contractors have the full set of CCPA rights. The
  CCPA binds a "business": a for-profit entity that does business in California, determines the
  purposes and means of processing, and meets a threshold, such as annual gross revenue over USD
  25,000,000 as adjusted under 1798.199.95(d)(5) (Cal. Civ. Code 1798.140(d)). Whether the organisation
  meets this test is for legal to confirm.

laws:
  - name: California Consumer Privacy Act of 2018, as amended by the California Privacy Rights Act
    citation: "Cal. Civ. Code 1798.100 et seq."
  - name: CCPA regulations
    citation: >-
      Cal. Code Regs. tit. 11, 7000 et seq., including the CCPA Updates, Cybersecurity Audit, Risk
      Assessment, ADMT and Insurance regulations (approved by OAL 22 September 2025, effective 1
      January 2026)
  - name: Data breach notification statute, as amended by SB 446 (2025)
    citation: "Cal. Civ. Code 1798.82"

regulator:
  name: California Privacy Protection Agency (CalPrivacy)
  url: https://cppa.ca.gov

# The CCPA has no lawful-basis requirement. Collection, use, retention and sharing must be
# reasonably necessary and proportionate to the disclosed purpose, or to another disclosed and
# compatible purpose; a new incompatible purpose needs a new notice first (Cal. Civ. Code
# 1798.100(a)(1), (c)). disclosed-purpose records that, for every purpose. The GDPR basis from
# the Irish base still applies to California instructors.
lawful_bases:
  tm:purpose/clearance-decision: [disclosed-purpose]
  tm:purpose/coaching: [disclosed-purpose]
  tm:purpose/calibration-and-audit: [disclosed-purpose]
  tm:purpose/quality-review: [disclosed-purpose]
  tm:purpose/bench-decision: [disclosed-purpose]
  tm:purpose/staffing-check: [disclosed-purpose]
  tm:purpose/train-the-trainer: [disclosed-purpose]
  tm:purpose/record-of-actions: [disclosed-purpose]
  tm:purpose/privacy-administration: [disclosed-purpose]

consent_valid_in_employment: false

# "Applies" says when the CCPA requires the element.
notice_elements:
  - id: ca-categories
    requirement: >-
      A list of the categories of personal information to be collected, written so the
      instructor understands what is collected. Applies always.
    citation: "Cal. Civ. Code 1798.100(a)(1); 11 CCR 7012(e)(1)"
  - id: ca-sensitive-categories
    requirement: >-
      The categories of sensitive personal information to be collected, if any. Applies if
      sensitive personal information is collected.
    citation: "Cal. Civ. Code 1798.100(a)(2); 11 CCR 7012(e)(1)"
  - id: ca-purposes
    requirement: The purposes for which each category is collected and used. Applies always.
    citation: "Cal. Civ. Code 1798.100(a)(1)-(2); 11 CCR 7012(e)(2)"
  - id: ca-sold-or-shared
    requirement: >-
      Whether each category is sold or shared. This programme intends neither. Applies always.
    citation: "Cal. Civ. Code 1798.100(a)(1); 11 CCR 7012(e)(3)"
  - id: ca-retention-per-category
    requirement: >-
      How long each category will be kept, or the criteria used to set that period. GDPR asks for
      the same per purpose; the CCPA asks for it per category. Applies always.
    citation: "Cal. Civ. Code 1798.100(a)(3); 11 CCR 7012(e)(4)"
  - id: ca-opt-out-link
    requirement: >-
      The link to the Notice of Right to Opt-out of Sale/Sharing. Applies if data is sold or shared.
    citation: "11 CCR 7012(e)(5)"
  - id: ca-privacy-policy-link
    requirement: >-
      A link to the business's privacy policy, or for an offline notice, where it can be found
      online. Applies always.
    citation: "11 CCR 7012(e)(6)"
notice_timing:
  rule: >-
    At or before the point of collection. A business that has not given the notice must not
    collect the personal information.
  citation: "Cal. Civ. Code 1798.100(a); 11 CCR 7012(c)-(d)"

# See review_notes: personnel-records. The only statutory period found (a four-year minimum for
# personnel records) may not reach these records, and no data category could be named for it.
retention_limits: []

# Criterion is the screening criterion id (src/teachermodel/pages.py, _DPIA_CRITERIA) a CCPA
# risk-assessment trigger (11 CCR 7150(b)) maps to. A trigger with no matching criterion keeps an
# id of its own, and a trigger the base screening does not cover opens the overlay's dpia-delta step.
dpia_triggers:
  - criterion: ca-sell-or-share
    citation: "11 CCR 7150(b)(1): selling or sharing personal information."
  - criterion: sensitive-data
    citation: >-
      11 CCR 7150(b)(2): processing sensitive personal information. Employee data used only for
      pay, work authorisation, benefits, accommodation or wage reporting is excepted.
  - criterion: automated-decision
    citation: >-
      11 CCR 7150(b)(3): using ADMT for a significant decision concerning a consumer.
  - criterion: prevents-rights-or-service
    citation: >-
      11 CCR 7150(b)(3): using ADMT for a significant decision concerning a consumer.
  - criterion: evaluation-scoring
    citation: >-
      11 CCR 7150(b)(4): using automated processing to infer or extrapolate a person's ability,
      aptitude, performance at work or behaviour, based on systematic observation of them as an
      employee or independent contractor.
  - criterion: systematic-monitoring
    citation: >-
      11 CCR 7150(b)(4): using automated processing to infer or extrapolate a person's ability,
      aptitude, performance at work or behaviour, based on systematic observation of them as an
      employee or independent contractor.
  - criterion: vulnerable-subjects
    citation: >-
      11 CCR 7150(b)(4): using automated processing to infer or extrapolate a person's ability,
      aptitude, performance at work or behaviour, based on systematic observation of them as an
      employee or independent contractor.
  - criterion: sensitive-data
    citation: >-
      11 CCR 7150(b)(5): inferring the same traits from presence at a sensitive location.
  - criterion: innovative-technology
    citation: >-
      11 CCR 7150(b)(6): processing personal information intended to train ADMT for a significant
      decision, or identification, facial-recognition or emotion-recognition technology.

transfers:
  - rule: >-
      The CCPA has no cross-border transfer rule. Disclosures to service providers and
      contractors need a written contract with terms the statute and regulations set. Transfers
      out of the EEA follow the base profile.
    citation: "Cal. Civ. Code 1798.100(d); Cal. Civ. Code 1798.140"

# Deadlines in calendar days. Rights with a deadline in business days carry it in the citation.
rights:
  - right: know
    deadline_days: 45
    citation: "Cal. Civ. Code 1798.110, 1798.115; 1798.130(a)(2)(A); 11 CCR 7021(b)"
  - right: delete
    deadline_days: 45
    citation: "Cal. Civ. Code 1798.105; 1798.130(a)(2)(A); 11 CCR 7021(b)"
  - right: correct
    deadline_days: 45
    citation: "Cal. Civ. Code 1798.106; 1798.130(a)(2)(A); 11 CCR 7021(b)"
  - right: opt-out-sale-share
    citation: >-
      Cal. Civ. Code 1798.120; 11 CCR 7026(f). Deadline 15 business days. The programme does not
      sell or share data, so no opt-out link is needed if that holds.
  - right: limit-sensitive-pi
    citation: >-
      Cal. Civ. Code 1798.121; 11 CCR 7027(g). Deadline 15 business days. Does not apply to
      sensitive personal information collected or processed without the purpose of inferring
      characteristics (1798.121(d)).
  - right: no-retaliation
    citation: "Cal. Civ. Code 1798.125"
  - right: admt-access-opt-out-appeal
    citation: >-
      11 CCR 7221, 7222. Applies when the business uses ADMT for a significant decision, from 1
      January 2027.

breach_notification:
  individuals: >-
    Notify affected California residents in the most expedient time possible and without
    unreasonable delay, and within 30 calendar days of discovering or being told of the breach.
    Delay is allowed for law enforcement needs, or to determine the scope of the breach and
    restore the system's integrity.
  citation: "Cal. Civ. Code 1798.82(a), as amended by SB 446, effective 1 January 2026"

