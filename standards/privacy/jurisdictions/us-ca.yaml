review_notes:
  # Sources: what was and was not fetched.
  - >-
    source CCPA statute (CPPA compilation): fetched. leginfo.legislature.ca.gov returned HTTP 403
    for every section. This compilation predates any amendments enacted after July 2024. Legal
    must check the current code text.
  - "source CPPA regulations text: fetched. Sections 7001, 7012, 7021, 7026, 7027, 7150, 7155, 7200 and 7221 were read."
  - "source CPPA rulemaking page: fetched. It states OAL approval and filing on 22 September 2025, effective 1 January 2026."
  - "source CPPA regulations index and employee-data page: fetched."
  - >-
    source Cal. Civ. Code 1798.82 / SB 446 (National Law Review): not fetched as a primary text.
    The primary text was not reached (leginfo returned HTTP 403). Facts were taken from search
    summaries of secondary sources: signed 3 October 2025, effective 1 January 2026, 30 calendar
    days. Legal must verify against the code.
  - >-
    source Cal. Gov. Code 12946 (california.public.law): not fetched; seen in search results only.
    Legal must verify the text and whether it reaches these records.
  - >-
    statute-version: the CCPA text used is the CPPA's July 2024 compilation. Amendments enacted in
    2025 or 2026 were not checked.

  # Applicability and bases.
  - >-
    business-threshold: the overlay only applies if the organisation is a CCPA "business" that does
    business in California. Legal to confirm, including the current adjusted revenue threshold.
  - >-
    contractors-as-consumers: independent contractors and partner instructors resident in
    California are consumers too. Legal to confirm whether the organisation or the partner organisation
    is the business for partner instructors.
  - >-
    basis-vocabulary: disclosed-purpose is not a legal basis. It records that California law has
    no basis requirement and limits use to the disclosed purpose. The GDPR basis from the Irish
    base still applies to California instructors.
  - >-
    consent-flag: the CCPA does not use lawful bases, so there is no consent basis to test. The
    flag consent_valid_in_employment is set false because no purpose may rest on consent; the base
    profile's position (consent rarely valid at work) still governs the choice of basis. Legal to
    confirm the representation.
  - >-
    regulator: the California Attorney General also enforces the CCPA.
  - >-
    no-sale-or-share: the notice states nothing is sold or shared. Sharing in CCPA terms means
    cross-context behavioural advertising; legal to confirm no disclosure in this programme counts.
  - >-
    retention-per-category: the CCPA notice states retention per category, the GDPR notice per
    purpose. retention@2 keys entries on category and purpose, so both views can be derived.
    Legal to confirm one notice can carry both.
  - >-
    employee-rulemaking: the CPPA invited preliminary comments on notices and disclosures and
    employee data; the comment period closed on 20 May 2026. No formal rulemaking was shown on
    the CPPA site on the access date (24 October 2026). Re-check before launch and before legal
    signs this profile, as the spec requires.

  # Retention.
  - >-
    retention-rule: keep personal information for each disclosed purpose no longer than
    reasonably necessary for that purpose (Cal. Civ. Code 1798.100(a)(3)).
  - >-
    personnel-records: Cal. Gov. Code 12946 (as amended by SB 807, effective 1 January 2022) sets
    a four-year minimum from the date of the employment action taken for applications, personnel,
    membership and referral records under the Fair Employment and Housing Act. Cal. Labor Code
    1198.5 gives employees a right to inspect personnel records (drafter's knowledge, not
    fetched). Legal to decide whether clearance, observation and coaching records are personnel
    records. If they are, a 48-month minimum for the right categories and a 30-day inspection
    duty may apply. No entry is in retention_limits because the category could not be named.

  # DPIA and automated decisions.
  - >-
    risk-assessment-rule: the CCPA has no DPIA. Its regulations require a risk assessment before
    starting processing that presents significant risk (11 CCR 7150). dpia_triggers maps the
    triggers to the base screening criteria. A trigger not covered by the base screening opens the
    overlay's dpia-delta step.
  - >-
    risk-assessment-definitions: systematic observation is methodical and regular or continuous
    observation, including by video or audio recording or live-streaming (11 CCR 7001(eee)). A
    significant decision includes employment or independent contracting opportunities or
    compensation: hiring; allocation or assignment of work, and pay; promotion; demotion,
    suspension and termination (11 CCR 7001(ddd)(4)). ADMT is technology that processes personal
    information and uses computation to replace, or substantially replace, human decisionmaking;
    human involvement needs a reviewer who knows how to use the output, reviews it with other
    relevant information, and has authority to make or change the decision (11 CCR 7001(e)).
  - >-
    risk-assessment-timing: conduct and document before starting the processing (11 CCR
    7155(a)(1)). Review at least every three years; update within 45 calendar days of a material
    change (7155(a)(2)-(3)). Processing started before 1 January 2026 and continuing: assess by 31
    December 2027 (7155(b)). Submit to the CPPA per 7157; the first submission date in the text is
    1 April 2028 (7157(a)(1)). Keep each assessment while processing continues or five years
    after completion, whichever is later (7155(c)).
  - >-
    admt-obligations: from 1 January 2027 a business using ADMT for a significant decision gives a
    pre-use notice, an opt-out (or an appeal to a human reviewer with authority to overturn,
    instead of the opt-out), and access to information about the ADMT (11 CCR 7200(b), 7220,
    7221(a)-(b), 7222).
  - >-
    risk-assessment-likely: 11 CCR 7150(b)(4) covers automated processing that infers performance
    at work from systematic observation of employees or contractors, and "systematic
    observation" includes video recording. The rules average observation scores and compare
    outcomes with a baseline. The drafter thinks this may be "automated processing to infer" even
    though people decide. If so, a risk assessment is due before the processing starts (or by 31
    December 2027 for processing begun before 2026).
  - >-
    admt-staffing-block: allocation or assignment of work is a significant decision. Clearances
    are human decisions, so the system is probably not ADMT. The staffing check's automatic block
    on an uncleared instructor deserves a look under the human-involvement test (11 CCR 7001(e)).
    The 7221(b)(3) exception for allocation of work may also be relevant.

  # Transfers, rights and incidents.
  - >-
    transfers-service-providers: contract terms for service providers were not extracted for this
    draft.
  - >-
    rights-confirm-receipt: within 10 business days of a request to delete, correct or know (and
    to access or appeal ADMT), confirm receipt and say how the request will be handled (11 CCR
    7021(a)).
  - >-
    rights-deadline: respond within 45 calendar days of receipt, counted from receipt whatever
    the time needed to verify. Extendable once by a further 45 days when reasonably necessary,
    with notice within the first 45 days (Cal. Civ. Code 1798.130(a)(2)(A); 11 CCR 7021(b)).
  - >-
    rights-methods: offer two or more designated methods, including at least a toll-free
    telephone number. A business operating exclusively online with a direct relationship may offer
    only an email address (Cal. Civ. Code 1798.130(a)(1)(A)).
  - >-
    rights-lookback: a request to know covers the 12 months before the request. On request it
    extends further back, to data collected on or after 1 January 2022, unless impossible or
    disproportionate (Cal. Civ. Code 1798.130(a)(2)(B)).
  - >-
    sensitive-pi: sensitive personal information means government identifiers; account log-in or
    financial account with credentials; precise geolocation; racial or ethnic origin, citizenship
    or immigration status, religious or philosophical beliefs, union membership; contents of mail,
    email and texts unless the business is the recipient; genetic data; biometric processing to
    identify; health; sex life or sexual orientation (Cal. Civ. Code 1798.140(ae)). None is
    intended. hr_ref in the identity block is an HR reference, not a government identifier;
    legal to confirm. Free-text notes could mention health incidentally.
  - >-
    breach-text-unverified: the 30-day breach deadline and AG timing come from secondary sources
    only.
  - >-
    breach-attorney-general: where more than 500 California residents are notified for one
    breach, send a sample copy of the notice to the Attorney General (Cal. Civ. Code 1798.82(f)).
    Secondary sources differ on the new deadline (15 calendar days after notifying residents, per
    one source). There is no regulator window in hours, so regulator_hours is absent.
  - >-
    breach-scope: 1798.82 covers "personal information" in its own narrow sense (a name with a
    government ID, account credentials, medical or similar data, or a username or email with a
    password). Most records here may fall outside it. This scope reading is the drafter's
    knowledge, not checked against the code text. The GDPR base still requires the DPC notice
    within 72 hours for every California instructor.
  - >-
    private-right-of-action: a person may sue when their nonencrypted and nonredacted personal
    information (as defined in 1798.81.5), or an email address with a password or security
    answer, is stolen or disclosed because the business failed to keep reasonable security. The
    employee exemption never applied to this section (Cal. Civ. Code 1798.150, 1798.145(m)(3)).
