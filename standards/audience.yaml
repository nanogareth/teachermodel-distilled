# The audience policy (decision 0027): which surfaces each role may open, and which fields of each it keeps.
# A surface or field a role is not given here is dropped. "*" keeps everything. `never` lists words that must not
# appear in any field name the role receives: a second guard behind the whitelist, so a field added to a read model
# later cannot leak a score to someone who sees status only (decision 0005). `own_only`: the role may open the
# surface only about themself, matched on `own_field` (default `instructor`). `named_roles`: fields in which another instructor's id may appear in someone's own
# record (who leads, co-delivers, observes or coaches them).
schema_version: 1
named_roles: [lead, co, observer, coach]
roles:
  head-of-training:
    surfaces:
      this-week: "*"
      coordinator-board: "*"
      my-record: "*"
      outbox: "*"            # decision 0029: what the chains would send; the head of training only
      request-status: "*"    # decision 0034
  coordinator:
    surfaces:
      coordinator-board:
        - as_of
        - deliveries.session
        - deliveries.programme
        - deliveries.date
        - deliveries.lead
        - deliveries.expected
        - deliveries.received
        - deliveries.unreadable
        - course
        - auditions.audition
        - auditions.stage
        - auditions.forms_in
        - auditions.replaced
        - requests            # decision 0034: the stage and who is proposed; the match page is its own view
        - sources
    never: [score, baseline, mean, pass, disagree, discuss, outcome]
  instructor:
    own_only: true
    surfaces:
      my-record: "*"
  requester:                  # decision 0034: someone outside the training function, about their own request
    own_only: true
    own_field: requester
    surfaces:
      request-status:
        - as_of
        - request
        - requester
        - programme
        - unit_title
        - mode
        - from
        - to
        - region
        - expected_learners
        - stage
        - reply_by
        - late
        - received_on
        - proposed.name
        - proposed.cleared_until
        - proposed.words
        - reason
    never: [score, baseline, mean, pass, disagree, discuss, outcome, booked, travel, candidate, coach]
