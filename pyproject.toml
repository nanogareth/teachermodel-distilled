[project]
name = "teachermodel"
version = "0.1.0"
description = "Instructor development infrastructure: clearance, coaching and quality rules for technical trainers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.54"]

[project.scripts]
teachermodel = "teachermodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teachermodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "tests"]
markers = [
    "browser: drives generated pages in headless chromium (needs the [browser] extra and `py -m playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
